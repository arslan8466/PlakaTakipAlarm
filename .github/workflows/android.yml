name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'PlakaTakipAlarm_Kaynak.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -o PlakaTakipAlarm_Kaynak.zip

      - name: Build APK
        working-directory: PlakaTakipAlarm
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlakaTakipAlarm-APK
          path: PlakaTakipAlarm/app/build/outputs/apk/debug/app-debug.apk
