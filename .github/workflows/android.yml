name: Android APK Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: unzip -o PlakaTakipAlarm_Kaynak.zip

      - name: Build APK
        working-directory: PlakaTakipAlarm
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PlakaTakipAlarm-APK
          path: PlakaTakipAlarm/app/build/outputs/apk/debug/app-debug.apk
